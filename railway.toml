# KrishiMitra — Railway Monorepo Config
# Three services in one Railway project, each with its own root directory.
#
# Service setup in Railway Dashboard:
#   krishi-ai     → Root: ai-service/    Builder: Dockerfile
#   krishi-server → Root: server/        Builder: Dockerfile
#   krishi-client → Root: client/        Builder: Dockerfile
#
# Environment variables per service are set in Railway Dashboard
# or via: railway variables set KEY=VALUE --service <name>
#
# See DEPLOY.md for full step-by-step instructions.

[build]
builder = "dockerfile"
